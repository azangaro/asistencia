<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Escáner QR - Con Historial Claro</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

:root {
    --bg: #f1f5f9;
    --card: #ffffff;
    --primary: #10b981;
    --primary-hover: #059669;
    --danger: #ef4444;
    --warning: #f59e0b;
    --success: #10b981;
    --text: #1e293b;
    --text-secondary: #64748b;
    --border: #e2e8f0;
    --shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
}

* { box-sizing: border-box; }

body {
    margin: 0;
    padding: 20px;
    min-height: 100vh;
    font-family: 'Inter', sans-serif;
    background:
        radial-gradient(circle at top right, #e2e8f0, transparent 50%),
        radial-gradient(circle at bottom left, #ccfbf1, transparent 50%),
        var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    transition: background 0.4s ease;
}

body.flash-ok { background: #d1fae5 !important; }
body.flash-danger { background: #fee2e2 !important; }

.wrap { width: 100%; max-width: 750px; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 24px; padding: 30px; box-shadow: var(--shadow); }
h1 { margin: 0; font-size: 2rem; font-weight: 700; color: #0f172a; }
.subtitle { color: var(--text-secondary); margin-top: 10px; line-height: 1.6; }
.row { display: grid; grid-template-columns: 1fr; gap: 20px; margin-top: 25px; }

@media (min-width: 640px) { .row { grid-template-columns: 1fr 1fr; } }

label { display: block; margin-bottom: 8px; font-size: 0.9rem; font-weight: 600; color: #475569; }
select { width: 100%; padding: 14px 16px; border-radius: 14px; border: 1px solid #cbd5e1; background: #ffffff; color: #0f172a; font-size: 15px; transition: .3s; cursor: pointer; }
select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px rgba(16,185,129,.15); }

button {
    width: 100%; margin-top: 25px; padding: 15px; border: none; border-radius: 14px;
    background: linear-gradient(135deg, var(--primary), var(--primary-hover)); color: white;
    font-size: 16px; font-weight: 700; cursor: pointer; transition: all .3s ease;
    box-shadow: 0 10px 15px -3px rgba(16,185,129,0.3);
}
button:hover { transform: translateY(-2px); box-shadow: 0 15px 20px -3px rgba(16,185,129,0.4); }

#reader {
    margin: 30px auto 20px; width: 100%; max-width: 420px; overflow: hidden;
    border-radius: 22px; border: 3px solid rgba(16,185,129,.3); background: #f8fafc;
    min-height: 250px; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
}

.status { margin-top: 20px; padding: 16px 18px; border-radius: 16px; font-weight: 600; font-size: 1.05rem; line-height: 1.5; border-left: 5px solid; animation: fadeIn .3s ease; }
.ok { background: #e6f4ea !important; border-color: #137333 !important; color: #137333 !important; }
.warn { background: #fef7e0 !important; border-color: #b06000 !important; color: #b06000 !important; }
.danger { background: #fce8e6 !important; border-color: #c5221f !important; color: #c5221f !important; }

/* --- NUEVA SECCIÓN DE ÚLTIMOS REGISTROS --- */
.history-section { margin-top: 35px; border-top: 1px dashed #cbd5e1; padding-top: 25px; }
.history-title { font-size: 1.1rem; font-weight: 700; color: #334155; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 0.5px; }
.history-list { display: flex; flex-direction: column; gap: 10px; }
.history-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 16px; border-radius: 12px; background: #f8fafc;
    border: 1px solid #e2e8f0; font-size: 0.95rem; animation: fadeIn 0.4s ease;
}
.history-info { display: flex; flex-direction: column; gap: 2px; }
.history-name { font-weight: 600; color: #1e293b; }
.history-sub { font-size: 0.8rem; color: #64748b; }
.badge {
    padding: 6px 10px; border-radius: 8px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase;
}
.badge-ingreso { background: #e6f4ea; color: #137333; border: 1px solid #a7f3d0; }
.badge-salida { background: #fef7e0; color: #b06000; border: 1px solid #fde68a; }

@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
#reader video { border-radius: 18px; }
#reader__scan_region { background: #f8fafc; }
#reader img { display: none !important; }
</style>
</head>
<body>
  <div class="wrap"><div class="card" id="mainCard">
    <h1>Escáner QR</h1>
    <p class="subtitle">Escanea para registrar asistencias en tiempo real.</p>
    
    <div class="row">
      <div><label>Estado</label><select id="estado"><option value="INGRESO">INGRESO</option><option value="SALIDA">SALIDA</option></select></div>
      <div><label>Cámara</label><select id="cameraSelect"><option value="">Pulsa "Activar cámara"</option></select></div>
    </div>
    
    <button id="btnStart" type="button">Activar cámara</button>
    <div id="reader"></div>
    <div id="status" class="status">Pulsa "Activar cámara" para iniciar.</div>

    <div class="history-section">
      <div class="history-title">Últimos Registros del Día</div>
      <div id="historyList" class="history-list">
        <div style="color: var(--text-secondary); font-size: 0.9rem; text-align: center; padding: 10px;">Esperando lecturas...</div>
      </div>
    </div>

  </div></div>

  <script>
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyovGwibQkDHZQVoyexgO705HnSguUbrlcYDolOFCYF0VAa_0dKg8IEmfao3j4pDw3u/exec';
    let html5QrCode = null;
    let currentCameraId = '';
    let lastScan = { text: '', time: 0 };
    let isRegistering = false;

    function setStatus(msg, type) {
      const el = document.getElementById('status');
      el.textContent = msg;
      el.className = 'status ' + (type || '');
      
      const body = document.body;
      body.className = ''; 
      if (type === 'ok') { body.classList.add('flash-ok'); setTimeout(() => body.classList.remove('flash-ok'), 1500); }
      else if (type === 'danger') { body.classList.add('flash-danger'); setTimeout(() => body.classList.remove('flash-danger'), 2000); }
    }

    // Renderiza la lista dinámica en el HTML claro
    function actualizarTablaHistorial(lista) {
      const contenedor = document.getElementById('historyList');
      if (!lista || lista.length === 0) return;
      
      contenedor.innerHTML = ''; // Limpiar el "Esperando lecturas..."
      
      lista.forEach(item => {
        const div = document.createElement('div');
        div.className = 'history-item';
        
        const claseBadge = item.estado.toLowerCase() === 'ingreso' ? 'badge-ingreso' : 'badge-salida';
        // Formatear hora sutil si viene completa
        let horaMuestra = item.fechaHora ? String(item.fechaHora).split('T')[1] || String(item.fechaHora) : '';
        if(horaMuestra.includes('.')) horaMuestra = horaMuestra.split('.')[0]; 

        div.innerHTML = `
          <div class="history-info">
            <span class="history-name">${item.nombre}</span>
            <span class="history-sub">${item.area || 'General'} • ${horaMuestra || 'Reciente'}</span>
          </div>
          <span class="badge ${claseBadge}">${item.estado}</span>
        `;
        contenedor.appendChild(div);
      });
    }

    function emitirAudioFeedback(tipo) {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();
        if (tipo === 'exito') {
          const osc = ctx.createOscillator(); const gain = ctx.createGain();
          osc.connect(gain); gain.connect(ctx.destination); osc.type = 'sine';
          osc.frequency.setValueAtTime(587.33, ctx.currentTime); gain.gain.setValueAtTime(0.1, ctx.currentTime);
          osc.start(); osc.frequency.setValueAtTime(783.99, ctx.currentTime + 0.08); osc.stop(ctx.currentTime + 0.22);
        } else {
          const osc = ctx.createOscillator(); const gain = ctx.createGain();
          osc.connect(gain); gain.connect(ctx.destination); osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(160, ctx.currentTime); osc.frequency.linearRampToValueAtTime(100, ctx.currentTime + 0.45);
          gain.gain.setValueAtTime(0.2, ctx.currentTime); gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.45);
          osc.start(); osc.stop(ctx.currentTime + 0.45);
        }
      } catch (e) {}
    }

    function ejecutarVibracionFeedback(tipo) {
      if (navigator.vibrate) { if (tipo === 'exito') navigator.vibrate(150); else navigator.vibrate([250, 100, 250]); }
    }

    function isDuplicate(text) {
      const now = Date.now(); if (lastScan.text === text && (now - lastScan.time) < 4000) return true;
      lastScan = { text, time: now }; return false;
    }

    async function stopScanner() {
      if (!html5QrCode) return;
      try { await html5QrCode.stop(); await html5QrCode.clear(); } catch(e) {}
      html5QrCode = null;
    }

    async function ensureCamerasLoaded() {
      const stream = await navigator.mediaDevices.getUserMedia({ video: true });
      stream.getTracks().forEach(track => track.stop());
      const devices = await Html5Qrcode.getCameras();
      const select = document.getElementById('cameraSelect');
      select.innerHTML = '';
      if (!devices || !devices.length) throw new Error('No se detectaron cámaras.');
      devices.forEach((cam, index) => {
        const option = document.createElement('option'); option.value = cam.id;
        const label = (cam.label || '').toLowerCase();
        option.textContent = /(back|rear|trasera)/i.test(label) ? 'Cámara trasera' : ('Cámara ' + (index + 1));
        select.appendChild(option);
      });
      currentCameraId = devices.find(d => /(back|rear|trasera)/i.test((d.label || '').toLowerCase()))?.id || devices[0].id;
      select.value = currentCameraId;
      select.onchange = function(){ currentCameraId = this.value; };
    }

    async function startScanner() {
      try {
        setStatus('Solicitando permiso de cámara...', 'warn');
        await stopScanner(); await ensureCamerasLoaded();
        html5QrCode = new Html5Qrcode('reader');
        await html5QrCode.start({ deviceId: { exact: currentCameraId } }, { fps: 10, qrbox: { width: 260, height: 260 }, aspectRatio: 1 }, onScanSuccess, function(){});
        setStatus('Escaneando... acerca el QR al recuadro.', 'ok');
      } catch (error) { setStatus('No se pudo activar la cámara: ' + error.message, 'danger'); }
    }

    function registrarPorJsonp(id, estado) {
      return new Promise((resolve, reject) => {
        const callbackName = 'qrCallback_' + Date.now() + '_' + Math.floor(Math.random() * 1000);
        const script = document.createElement('script');
        const timeout = setTimeout(() => { cleanup(); reject(new Error('Tiempo agotado.')); }, 12000);
        function cleanup() { clearTimeout(timeout); if (script.parentNode) script.parentNode.removeChild(script); delete window[callbackName]; }
        window[callbackName] = function(response) { cleanup(); resolve(response); };
        script.onerror = function() { cleanup(); reject(new Error('Error de conexión con Apps Script.')); };
        script.src = APPS_SCRIPT_URL + '?page=registrar_jsonp&id=' + encodeURIComponent(id) + '&estado=' + encodeURIComponent(estado) + '&callback=' + encodeURIComponent(callbackName);
        document.body.appendChild(script);
      });
    }

    async function onScanSuccess(decodedText) {
      if (isRegistering || isDuplicate(decodedText)) return;
      isRegistering = true;
      const id = decodedText.trim();
      const estado = document.getElementById('estado').value;
      
      setStatus('QR detectado. Procesando...', 'warn');
      await stopScanner();

      try {
        const response = await registrarPorJsonp(id, estado);
        if (response && response.exito) {
          emitirAudioFeedback('exito'); ejecutarVibracionFeedback('exito');
          setStatus(`${response.estado} registrado: ${response.nombre}`, 'ok');
          
          // Si el Backend te retorna un nodo de historial (.ultimos), la lista se dibuja sola aquí:
          if(response.ultimos) actualizarTablaHistorial(response.ultimos);
          
        } else {
          emitirAudioFeedback('error'); ejecutarVibracionFeedback('error');
          setStatus(response.mensaje || 'No se pudo registrar.', 'danger');
        }
      } catch (error) {
        emitirAudioFeedback('error'); ejecutarVibracionFeedback('error');
        setStatus(error.message || 'Error al registrar.', 'danger');
      }

      isRegistering = false;
      setTimeout(() => { startScanner(); }, 2200);
    }

    document.getElementById('btnStart').addEventListener('click', startScanner);
    window.addEventListener('beforeunload', function(){ stopScanner(); });
  </script>
</body>
</html>
