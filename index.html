<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Escáner QR Blogger</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

:root {
    --bg: #0f172a;
    --card: rgba(15, 23, 42, 0.85);
    --primary: #22c55e;
    --primary-hover: #16a34a;
    --danger: #ef4444;
    --warning: #f59e0b;
    --success: #10b981;
    --text: #f8fafc;
    --text-secondary: #94a3b8;
    --border: rgba(255,255,255,.08);
    --shadow: 0 20px 40px rgba(0,0,0,.35);
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    min-height: 100vh;
    font-family: 'Inter', sans-serif;
    background:
        radial-gradient(circle at top right, #1e293b, transparent 40%),
        radial-gradient(circle at bottom left, #134e4a, transparent 40%),
        var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
}

.wrap {
    width: 100%;
    max-width: 750px;
}

.card {
    background: var(--card);
    backdrop-filter: blur(14px);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 30px;
    box-shadow: var(--shadow);
}

h1 {
    margin: 0;
    font-size: 2rem;
    font-weight: 700;
}

.subtitle {
    color: var(--text-secondary);
    margin-top: 10px;
    line-height: 1.6;
}

.row {
    display: grid;
    grid-template-columns: 1fr;
    gap: 20px;
    margin-top: 25px;
}

@media (min-width: 640px) {
    .row {
        grid-template-columns: 1fr 1fr;
    }
}

label {
    display: block;
    margin-bottom: 8px;
    font-size: 0.9rem;
    font-weight: 600;
    color: #cbd5e1;
}

select {
    width: 100%;
    padding: 14px 16px;
    border-radius: 14px;
    border: 1px solid var(--border);
    background: rgba(30,41,59,.8);
    color: white;
    font-size: 15px;
    transition: .3s;
}

select:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 4px rgba(34,197,94,.15);
}

button {
    width: 100%;
    margin-top: 25px;
    padding: 15px;
    border: none;
    border-radius: 14px;
    background: linear-gradient(
        135deg,
        var(--primary),
        var(--primary-hover)
    );
    color: white;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: all .3s ease;
    box-shadow: 0 10px 20px rgba(34,197,94,.25);
}

button:hover {
    transform: translateY(-2px);
    box-shadow: 0 15px 30px rgba(34,197,94,.35);
}

button:active {
    transform: translateY(0);
}

#reader {
    margin: 30px auto 20px;
    width: 100%;
    max-width: 420px;
    overflow: hidden;
    border-radius: 22px;
    border: 3px solid rgba(34,197,94,.4);
    background: #000;
    min-height: 250px;
    box-shadow:
        0 0 0 6px rgba(34,197,94,.08),
        0 20px 40px rgba(0,0,0,.4);
}

.status {
    margin-top: 20px;
    padding: 16px 18px;
    border-radius: 16px;
    font-weight: 500;
    line-height: 1.5;
    border-left: 5px solid;
    animation: fadeIn .3s ease;
}

.ok {
    background: rgba(16,185,129,.15);
    border-color: var(--success);
    color: #d1fae5;
}

.warn {
    background: rgba(245,158,11,.15);
    border-color: var(--warning);
    color: #fde68a;
}

.danger {
    background: rgba(239,68,68,.15);
    border-color: var(--danger);
    color: #fecaca;
}

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(8px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* Ajustes del escáner QR */

#reader video {
    border-radius: 18px;
}

#reader__scan_region {
    background: #000;
}

#reader img {
    display: none !important;
}
</style>
</head>
<body>
  <div class="wrap"><div class="card"><h1>Escáner QR</h1>
    <p class="subtitle">
  Escanea el código QR para registrar ingresos y salidas.
  El sistema procesará la asistencia automáticamente y continuará listo para el siguiente registro.
</p>
    <div class="row">
      <div><label>Estado</label><select id="estado"><option value="INGRESO">INGRESO</option><option value="SALIDA">SALIDA</option></select></div>
      <div><label>Cámara</label><select id="cameraSelect"><option value="">Pulsa "Activar cámara"</option></select></div>
    </div>
    <button id="btnStart" type="button">Activar cámara</button>
    <div id="reader"></div>
    <div id="status" class="status">Pulsa "Activar cámara" para iniciar.</div>
  </div></div>

  <script>
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzLYPI26jnFRzAfYa4V45ko6L_FZ1sHY4slGBI5eeTEGXzhewP0bCLxwPYlotr94OYk/exec';
    let html5QrCode = null;
    let currentCameraId = '';
    let lastScan = { text: '', time: 0 };
    let isRegistering = false;

    function setStatus(msg, type) {
      const el = document.getElementById('status');
      el.textContent = msg;
      el.className = 'status ' + (type || '');
    }

    function isDuplicate(text) {
      const now = Date.now();
      if (lastScan.text === text && (now - lastScan.time) < 4000) return true;
      lastScan = { text, time: now };
      return false;
    }

    async function stopScanner() {
      if (!html5QrCode) return;
      try { await html5QrCode.stop(); } catch(e) {}
      try { await html5QrCode.clear(); } catch(e) {}
      html5QrCode = null;
    }

    async function ensureCamerasLoaded() {
      const stream = await navigator.mediaDevices.getUserMedia({ video: true });
      stream.getTracks().forEach(track => track.stop());
      const devices = await Html5Qrcode.getCameras();
      const select = document.getElementById('cameraSelect');
      select.innerHTML = '';
      if (!devices || !devices.length) throw new Error('No se detectaron cámaras.');
      devices.forEach((cam, index) => {
        const option = document.createElement('option');
        option.value = cam.id;
        const label = (cam.label || '').toLowerCase();
        option.textContent = /(back|rear|trasera)/i.test(label) ? 'Cámara trasera' : ('Cámara ' + (index + 1));
        select.appendChild(option);
      });
      const rear = devices.find(d => /(back|rear|trasera)/i.test((d.label || '').toLowerCase()));
      currentCameraId = rear ? rear.id : devices[0].id;
      select.value = currentCameraId;
      select.onchange = function(){ currentCameraId = this.value; };
    }

    async function startScanner() {
      try {
        setStatus('Solicitando permiso de cámara...', 'warn');
        await stopScanner();
        await ensureCamerasLoaded();
        html5QrCode = new Html5Qrcode('reader');
        await html5QrCode.start(
          { deviceId: { exact: currentCameraId } },
          { fps: 10, qrbox: { width: 260, height: 260 }, aspectRatio: 1 },
          onScanSuccess,
          function(){}
        );
        setStatus('Escaneando... acerca el QR al recuadro.', 'ok');
      } catch (error) {
        setStatus('No se pudo activar la cámara: ' + (error.message || error), 'danger');
      }
    }

    function registrarPorJsonp(id, estado) {
      return new Promise((resolve, reject) => {
        const callbackName = 'qrCallback_' + Date.now() + '_' + Math.floor(Math.random() * 1000);
        const script = document.createElement('script');
        const timeout = setTimeout(() => {
          cleanup();
          reject(new Error('Tiempo de espera agotado al registrar.'));
        }, 12000);

        function cleanup() {
          clearTimeout(timeout);
          if (script.parentNode) script.parentNode.removeChild(script);
          delete window[callbackName];
        }

        window[callbackName] = function(response) {
          cleanup();
          resolve(response);
        };

        script.onerror = function() {
          cleanup();
          reject(new Error('No se pudo contactar con Apps Script.'));
        };

        script.src = APPS_SCRIPT_URL +
          '?page=registrar_jsonp' +
          '&id=' + encodeURIComponent(id) +
          '&estado=' + encodeURIComponent(estado) +
          '&callback=' + encodeURIComponent(callbackName);

        document.body.appendChild(script);
      });
    }

    async function onScanSuccess(decodedText) {
      if (isRegistering || isDuplicate(decodedText)) return;
      isRegistering = true;
      const id = decodedText.trim();
      const estado = document.getElementById('estado').value;
      setStatus('QR detectado. Registrando asistencia...', 'warn');
      await stopScanner();

      try {
        const response = await registrarPorJsonp(id, estado);
        if (response && response.exito) {
          setStatus(`${response.estado} registrado: ${response.nombre} ${response.hora ? '- ' + response.hora : ''}`, 'ok');
        } else {
          setStatus((response && response.mensaje) || 'No se pudo registrar.', 'danger');
        }
      } catch (error) {
        setStatus(error.message || 'Error al registrar.', 'danger');
      }

      isRegistering = false;
      setTimeout(() => { startScanner(); }, 1800);
    }

    document.getElementById('btnStart').addEventListener('click', startScanner);
    window.addEventListener('beforeunload', function(){ stopScanner(); });
  </script>
</body>
</html>
