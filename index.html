<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Escáner QR - Historial Automático</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

:root {
    --bg: #f1f5f9;
    --card: #ffffff;
    --primary: #10b981;
    --primary-hover: #059669;
    --danger: #ef4444;
    --danger-hover: #dc2626;
    --warning: #f59e0b;
    --success: #10b981;
    --text: #1e293b;
    --text-secondary: #64748b;
    --border: #e2e8f0;
    --shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
}

* { box-sizing: border-box; }

body {
    margin: 0; padding: 20px; min-height: 100vh;
    font-family: 'Inter', sans-serif;
    background: radial-gradient(circle at top right, #e2e8f0, transparent 50%), radial-gradient(circle at bottom left, #ccfbf1, transparent 50%), var(--bg);
    color: var(--text); display: flex; justify-content: center; transition: background 0.4s ease;
}

body.flash-ok { background: #d1fae5 !important; }
body.flash-danger { background: #fee2e2 !important; }

.wrap { width: 100%; max-width: 750px; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 24px; padding: 30px; box-shadow: var(--shadow); }
h1 { margin: 0; font-size: 2rem; font-weight: 700; color: #0f172a; }
.subtitle { color: var(--text-secondary); margin-top: 10px; line-height: 1.6; }
.row { display: grid; grid-template-columns: 1fr; gap: 20px; margin-top: 25px; }

@media (min-width: 640px) { .row { grid-template-columns: 1fr 1fr; } }

label { display: block; margin-bottom: 8px; font-size: 0.9rem; font-weight: 600; color: #475569; }
select, input[type="text"] { width: 100%; padding: 14px 16px; border-radius: 14px; border: 1px solid #cbd5e1; background: #ffffff; color: #0f172a; font-size: 15px; transition: .3s; }
select:focus, input[type="text"]:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px rgba(16,185,129,.15); }

button {
    width: 100%; margin-top: 25px; padding: 15px; border: none; border-radius: 14px;
    background: linear-gradient(135deg, var(--primary), var(--primary-hover)); color: white;
    font-size: 16px; font-weight: 700; cursor: pointer; transition: all .3s ease;
    box-shadow: 0 10px 15px -3px rgba(16,185,129,0.3);
}
button:hover { transform: translateY(-2px); box-shadow: 0 15px 20px -3px rgba(16,185,129,0.4); }

button.btn-stop {
    background: linear-gradient(135deg, var(--danger), var(--danger-hover));
    box-shadow: 0 10px 15px -3px rgba(239, 68, 68, 0.3);
}
button.btn-stop:hover { box-shadow: 0 15px 20px -3px rgba(239, 68, 68, 0.4); }

#reader {
    margin: 0 auto; width: 100%; max-width: 420px; overflow: hidden;
    border-radius: 22px; border: 0px solid transparent; background: #f8fafc;
    max-height: 0px; transition: max-height 0.4s ease, margin 0.3s ease;
}
#reader.active {
    margin: 30px auto 20px; max-height: 450px;
    border: 3px solid rgba(16,185,129,.3); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
}

.manual-section {
    margin: 20px auto; width: 100%; max-width: 420px; padding: 20px;
    background: #f8fafc; border: 1px dashed #cbd5e1; border-radius: 20px;
    animation: fadeIn .3s ease; display: none;
}
.manual-group { display: flex; gap: 10px; margin-top: 8px; }
.manual-group input { flex: 1; }
.manual-group button { width: auto; margin-top: 0; padding: 0 24px; }

.status { margin-top: 20px; padding: 16px 18px; border-radius: 16px; font-weight: 600; font-size: 1.05rem; line-height: 1.5; border-left: 5px solid; animation: fadeIn .3s ease; }
.ok { background: #e6f4ea !important; border-color: #137333 !important; color: #137333 !important; }
.warn { background: #fef7e0 !important; border-color: #b06000 !important; color: #b06000 !important; }
.danger { background: #fce8e6 !important; border-color: #c5221f !important; color: #c5221f !important; }

.history-section { margin-top: 35px; border-top: 1px dashed #cbd5e1; padding-top: 25px; }
.history-title { font-size: 1.1rem; font-weight: 700; color: #334155; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 0.5px; }
.history-list { display: flex; flex-direction: column; gap: 10px; }
.history-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 16px; border-radius: 12px; background: #f8fafc;
    border: 1px solid #e2e8f0; font-size: 0.95rem; animation: slideIn 0.3s ease-out;
}
.history-item.item-error { border-color: #fca5a5; background: #fff5f5; }

.history-info { display: flex; flex-direction: column; gap: 2px; }
.history-name { font-weight: 600; color: #1e293b; }
.history-name.text-error { color: #b91c1c; }
.history-sub { font-size: 0.8rem; color: #64748b; }
.badge { padding: 6px 10px; border-radius: 8px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; }
.badge-ingreso { background: #e6f4ea; color: #137333; border: 1px solid #a7f3d0; }
.badge-salida { background: #fef7e0; color: #b06000; border: 1px solid #fde68a; }
.badge-error { background: #fee2e2; color: #c5221f; border: 1px solid #fca5a5; }

@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
@keyframes slideIn { from { opacity: 0; transform: translateX(-15px); } to { opacity: 1; transform: translateX(0); } }
#reader video { border-radius: 18px; }
#reader__scan_region { background: #f8fafc; }
#reader img { display: none !important; }
</style>
</head>
<body>
  <div class="wrap"><div class="card" id="mainCard">
    <h1>Escáner QR</h1>
    <p class="subtitle">Escanea para registrar asistencias en tiempo real.</p>
    
    <div class="row">
      <div><label>Estado</label><select id="estado"><option value="INGRESO">INGRESO</option><option value="SALIDA">SALIDA</option></select></div>
      <div><label>Cámara</label><select id="cameraSelect"><option value="">Pulsa "Activar cámara"</option></select></div>
    </div>
    
    <button id="btnStart" type="button">Activar cámara</button>
    
    <div id="manualSection" class="manual-section">
      <label for="manualId">Código / ID Manual</label>
      <div class="manual-group">
        <input type="text" id="manualId" placeholder="Ej. 10293847" autocomplete="off">
        <button id="btnManualSubmit" type="button">Enviar</button>
      </div>
    </div>

    <div id="reader"></div>
    <div id="status" class="status">Pulsa "Activar cámara" para iniciar o usa el registro manual.</div>

    <div class="history-section">
      <div class="history-title">Últimos Registros de la Sesión</div>
      <div id="historyList" class="history-list">
        <div id="noRecords" style="color: var(--text-secondary); font-size: 0.9rem; text-align: center; padding: 10px;">Esperando lecturas...</div>
      </div>
    </div>

  </div></div>

  <script>
    // PON AQUÍ TU NUEVA URL GENERADA EN EL PASO 1
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwJ5u9zbPsPPnHEaJFT2dKOC5lxgxXQa7ZuQN_0tEQ-WTlWANx5uJ-zXhinXHIHyGeU/exec';
    
    let html5QrCode = null;
    let currentCameraId = '';
    let lastScan = { text: '', time: 0 };
    let isRegistering = false;
    let scannerRunning = false;
    let listaRegistrosLocales = [];

    document.addEventListener("DOMContentLoaded", () => {
      actualizarInterfazBoton(false);
    });

    function setStatus(msg, type) {
      const el = document.getElementById('status');
      el.textContent = msg; el.className = 'status ' + (type || '');
      const body = document.body; body.className = ''; 
      if (type === 'ok') { body.classList.add('flash-ok'); setTimeout(() => body.classList.remove('flash-ok'), 1500); }
      else if (type === 'danger') { body.classList.add('flash-danger'); setTimeout(() => body.classList.remove('flash-danger'), 2000); }
    }

    function agregarAlHistorialLocal(nombre, estado, esError = false) {
      const contenedor = document.getElementById('historyList');
      const noRecordsEl = document.getElementById('noRecords');
      if (noRecordsEl) noRecordsEl.remove();

      const ahora = new Date();
      const horaString = ahora.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });

      listaRegistrosLocales.unshift({ nombre, estado, hora: horaString, esError });
      if (listaRegistrosLocales.length > 5) listaRegistrosLocales.pop();

      contenedor.innerHTML = '';
      listaRegistrosLocales.forEach(item => {
        const div = document.createElement('div');
        let claseBadge = item.esError ? 'badge-error' : (item.estado.toLowerCase() === 'ingreso' ? 'badge-ingreso' : 'badge-salida');
        let claseNombreError = item.esError ? 'text-error' : '';
        div.className = 'history-item' + (item.esError ? ' item-error' : '');

        div.innerHTML = `
          <div class="history-info">
            <span class="history-name ${claseNombreError}">${item.nombre}</span>
            <span class="history-sub">Detectado a las ${item.hora}</span>
          </div>
          <span class="badge ${claseBadge}">${item.estado}</span>
        `;
        contenedor.appendChild(div);
      });
    }

    function emitirAudioFeedback(tipo) {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext; if (!AudioContext) return;
        const ctx = new AudioContext();
        if (tipo === 'exito') {
          const osc = ctx.createOscillator(); const gain = ctx.createGain(); osc.connect(gain); gain.connect(ctx.destination);
          osc.type = 'sine'; osc.frequency.setValueAtTime(587.33, ctx.currentTime); gain.gain.setValueAtTime(0.1, ctx.currentTime);
          osc.start(); osc.frequency.setValueAtTime(783.99, ctx.currentTime + 0.08); osc.stop(ctx.currentTime + 0.22);
        } else {
          const osc = ctx.createOscillator(); const gain = ctx.createGain(); osc.connect(gain); gain.connect(ctx.destination);
          osc.type = 'sawtooth'; osc.frequency.setValueAtTime(160, ctx.currentTime); osc.frequency.linearRampToValueAtTime(100, ctx.currentTime + 0.45);
          gain.gain.setValueAtTime(0.2, ctx.currentTime); gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.45);
          osc.start(); osc.stop(ctx.currentTime + 0.45);
        }
      } catch (e) {}
    }

    function ejecutarVibracionFeedback(tipo) {
      if (navigator.vibrate) { if (tipo === 'exito') navigator.vibrate(150); else navigator.vibrate([250, 100, 250]); }
    }

    function isDuplicate(text) {
      const now = Date.now(); if (lastScan.text === text && (now - lastScan.time) < 5000) return true;
      lastScan = { text, time: now }; return false;
    }

    async function stopScanner() {
      if (!html5QrCode) return;
      try { await html5QrCode.stop(); await html5QrCode.clear(); } catch(e) {}
      html5QrCode = null; scannerRunning = false; actualizarInterfazBoton(false);
    }

    async function ensureCamerasLoaded() {
      const stream = await navigator.mediaDevices.getUserMedia({ video: true });
      stream.getTracks().forEach(track => track.stop());
      const devices = await Html5Qrcode.getCameras();
      const select = document.getElementById('cameraSelect'); select.innerHTML = '';
      if (!devices || !devices.length) throw new Error('No se detectaron cámaras.');
      devices.forEach((cam, index) => {
        const option = document.createElement('option'); option.value = cam.id;
        const label = (cam.label || '').toLowerCase();
        option.textContent = /(back|rear|trasera)/i.test(label) ? 'Cámara trasera' : ('Cámara ' + (index + 1));
        select.appendChild(option);
      });
      if(!currentCameraId) currentCameraId = devices.find(d => /(back|rear|trasera)/i.test((d.label || '').toLowerCase()))?.id || devices[0].id;
      select.value = currentCameraId;
      select.onchange = async function(){ currentCameraId = this.value; if(scannerRunning) { await startScanner(); } };
    }

    async function startScanner() {
      try {
        setStatus('Solicitando permiso de cámara...', 'warn');
        if(html5QrCode) { await stopScanner(); }
        await ensureCamerasLoaded();
        html5QrCode = new Html5Qrcode('reader');
        document.getElementById('reader').classList.add('active');
        await html5QrCode.start({ deviceId: { exact: currentCameraId } }, { fps: 15, qrbox: { width: 260, height: 260 }, aspectRatio: 1 }, onScanSuccess, function(){});
        scannerRunning = true; actualizarInterfazBoton(true); setStatus('Escaneando... acerca el QR al recuadro.', 'ok');
      } catch (error) { 
        setStatus('No se pudo activar la cámara: ' + error.message, 'danger'); 
        scannerRunning = false; actualizarInterfazBoton(false);
      }
    }

    function actualizarInterfazBoton(activo) {
      const btn = document.getElementById('btnStart'); const readerDiv = document.getElementById('reader'); const manualSection = document.getElementById('manualSection');
      if(activo) {
        btn.textContent = "Desactivar cámara"; btn.classList.add('btn-stop'); readerDiv.classList.add('active'); manualSection.style.display = 'none';
      } else {
        btn.textContent = "Activar cámara"; btn.classList.remove('btn-stop'); readerDiv.classList.remove('active'); manualSection.style.display = 'block';
      }
    }

    async function toggleScanner() {
      const btn = document.getElementById('btnStart'); btn.disabled = true;
      if (scannerRunning) { await stopScanner(); setStatus('Cámara desactivada. Modo manual activo.', 'warn'); } 
      else { await startScanner(); }
      btn.disabled = false;
    }

    // NUEVO MÉTODO ESTÁNDAR COMPATIBLE CON CHROME (FETCH)
    async function registrarConFetch(id, estado) {
      const urlCompleta = `${APPS_SCRIPT_URL}?page=registrar_jsonp&id=${encodeURIComponent(id)}&estado=${encodeURIComponent(estado)}`;
      
      // Control de tiempo de espera (Timeout de 12 segundos)
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 12000);

      try {
        const respuesta = await fetch(urlCompleta, { 
          method: 'GET',
          mode: 'cors', // Crucial para saltar restricciones locales de Chrome
          signal: controller.signal 
        });
        clearTimeout(timeoutId);
        
        if (!respuesta.ok) throw new Error('Respuesta del servidor inválida.');
        return await respuesta.json(); // Retorna el JSON limpio directo de Google
      } catch (err) {
        clearTimeout(timeoutId);
        if (err.name === 'AbortError') throw new Error('Tiempo de espera agotado.');
        throw err;
      }
    }

    async function procesarRegistro(idLimpio) {
      if (isRegistering) return;
      isRegistering = true;
      
      const estado = document.getElementById('estado').value;
      setStatus('Procesando solicitud...', 'warn');

      try {
        // Ejecutamos la consulta moderna sin JSONP
        const response = await registrarConFetch(idLimpio, estado);
        
        if (response && response.exito === true) {
          emitirAudioFeedback('exito'); ejecutarVibracionFeedback('exito');
          setStatus(`${response.estado} registrado: ${response.nombre}`, 'ok');
          agregarAlHistorialLocal(response.nombre, response.estado, false);
          document.getElementById('manualId').value = '';
        } else {
          emitirAudioFeedback('error'); ejecutarVibracionFeedback('error');
          const msgError = (response && response.mensaje) ? response.mensaje : 'No se pudo registrar.';
          setStatus(msgError, 'danger');
          agregarAlHistorialLocal(`ID: ${idLimpio} - ${msgError}`, 'ERROR', true);
        }
      } catch (error) {
        emitirAudioFeedback('error'); ejecutarVibracionFeedback('error');
        const msgFallo = 'Error de conexión con Apps Script.';
        setStatus(msgFallo, 'danger');
        agregarAlHistorialLocal(`ID: ${idLimpio} - Fallo de red`, 'FALLO', true);
      }

      setTimeout(() => {
        isRegistering = false;
        if (scannerRunning) setStatus('Escaneando... acerca el QR al recuadro.', 'ok');
        else setStatus('Modo de ingreso manual activo.', 'ok');
      }, 2500);
    }

    async function onScanSuccess(decodedText) {
      if (isDuplicate(decodedText)) return;
      await procesarRegistro(decodedText.trim());
    }

    document.getElementById('btnManualSubmit').addEventListener('click', () => {
      const input = document.getElementById('manualId'); const valor = input.value.trim();
      if (!valor) { setStatus('Por favor, escribe un código válido.', 'danger'); return; }
      procesarRegistro(valor);
    });

    document.getElementById('manualId').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { const valor = e.target.value.trim(); if (valor) procesarRegistro(valor); }
    });

    document.getElementById('btnStart').addEventListener('click', toggleScanner);
    window.addEventListener('beforeunload', function(){ stopScanner(); });
  </script>
</body>
</html>
